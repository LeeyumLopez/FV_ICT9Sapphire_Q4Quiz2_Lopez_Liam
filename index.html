
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Score Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f9ff;
    }

    .title {
      background-color: #00c2ff;
      padding: 10px;
      border-radius: 10px;
      color: #fff;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .toggle-instruction {
      cursor: pointer;
      color: #333;
      font-weight: bold;
    }

    #instructions.hidden {
      display: none;
    }

    .subject-container {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .subject {
      text-align: center;
      margin: 10px;
    }

    .subject img {
      width: 120px;
      height: auto;
      margin-bottom: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .subject input {
      width: 100px;
      text-align: center;
      padding: 5px;
      font-size: 1.2rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .note {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #666;
    }

    footer {
      margin-top: 30px;
      color: #888;
    }

    #result {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
    }
    .subject-container {
      display: flex;
      justify-content: center; /* Center the subjects horizontally */
      flex-wrap: wrap; /* Allow wrapping for smaller screens */
      gap: 20px; /* Add spacing between subjects */
      margin-top: 20px;
    }

    .subject {
      text-align: center;
      margin: 10px;
      flex: 1 1 200px; /* Ensure consistent sizing for each subject */
      max-width: 200px; /* Limit the maximum width */
    }

    .subject img {
      width: 100%; /* Make the image responsive */
      height: auto; /* Maintain aspect ratio */
      max-width: 120px; /* Set a consistent maximum width */
      margin-bottom: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .subject input {
      width: 100px;
      text-align: center;
      padding: 5px;
      font-size: 1.2rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container text-center mt-4">
    <h1 class="title">Score Analyzer</h1>
    <p class="toggle-instruction" onclick="toggleInstructions()">⏬ instructions</p>
    <p id="instructions" class="hidden">Enter your grades in the following subjects to reveal your overall average scoring.</p>

    <div class="subject-container">
      <div class="subject">
        <a href="https://dictionary.langeek.co/en/word/162037?entry=science" target="_blank">
          <img src="https://img.brainkart.com/article/articleTEVa9s13.png" alt="Science"></a>
        <input type="number" id="science" min="0" max="100" placeholder="Science">
      </div>
      <div class="subject">
        <a href="https://career.uconn.edu/blog/2019/09/11/math-careers-in-unlikely-places/" target="_blank">
          <img src="https://cdn.uconnectlabs.com/wp-content/uploads/sites/7/2019/08/math-840x560.jpg?v=56233" alt="Math"></a>
        <input type="number" id="math" min="0" max="100" placeholder="Math">
      </div>
      <div class="subject">
        <a href="https://pin.it/7dk7eFyZo" target="_blank">
          <img src="https://i.pinimg.com/736x/1e/b5/50/1eb550a25e2d548ef5496b3d36572f3a.jpg" alt="English"></a>
        <input type="number" id="english" min="0" max="100" placeholder="English">
      </div>
      <div class="subject">
        <a href="https://darwishdemesa.wordpress.com/2014/03/18/glaiza-cuenca-nitural-bsed-filipino-major/">
          <img src="https://darwishdemesa.wordpress.com/wp-content/uploads/2014/03/gj.jpg" alt="Filipino"></a>
        <input type="number" id="filipino" min="0" max="100" placeholder="Filipino">
      </div>
    </div>

    <button onclick="analyzeScore()" class="btn btn-primary mt-3">Get Rating</button>
    <p id="result"></p>
    <p class="note">Note: Grading Criteria and Equivalents can vary depending on school or district.</p>
    <footer>
      Liam G. Lopez
    </footer>
  </div>

    <script>
    function analyzeScore() {
      var science = +document.getElementById("science").value;
      var math = +document.getElementById("math").value;
      var english = +document.getElementById("english").value;
      var filipino = +document.getElementById("filipino").value;
  
      if (
        isNaN(science) || science < 0 || science > 100 ||
        isNaN(math) || math < 0 || math > 100 ||
        isNaN(english) || english < 0 || english > 100 ||
        isNaN(filipino) || filipino < 0 || filipino > 100
      ) {
        document.getElementById("result").innerHTML = "Please enter valid grades between 0 and 100 for all subjects.";
        return;
      }
  
      var average = (science + math + english + filipino) / 4;
      var rating = "";
  
      if (average >= 94 && average <= 100) {
        rating = "Excellent";
      } else if (average >= 87 && average < 94) {
        rating = "Above Satisfactory";
      } else if (average >= 80 && average < 87) {
        rating = "Satisfactory";
      } else if (average >= 75 && average < 80) {
        rating = "Needs Improvement";
      } else if (average >= 70 && average < 75) {
        rating = "Poor";
      } else {
        rating = "Invalid average.";
      }
  
      document.getElementById("result").innerHTML = `Your average is ${average.toFixed(2)} - ${rating}`;
    }
    }
  </script>
</body>
</html>
